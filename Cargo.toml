[package]
name = "bio-suite"
version = "0.4.0"
edition = "2021"
authors = ["CRV Science Labs <labs@crvscience.com>"]
description = "High-throughput GPL-3.0 bioinformatics, chemoinformatics, molecular systematics, and information-theoretic genome complexity suite with deterministic worker-agent pipelines."
license = "GPL-3.0-or-later"
repository = "https://github.com/bpwhite/crvscience-labs"
homepage = "https://crvscience.com/labs"
readme = "README.md"
keywords = ["bioinformatics", "phylogenetics", "genomics", "complexity", "barcoding"]
categories = ["science", "command-line-utilities"]

[[bin]]
name = "bio-suite"
path = "src/main.rs"

[[bin]]
name = "runie-align-view"
path = "src/bin/runie_align_view.rs"

[[bin]]
name = "bio-suite-supervisor"
path = "src/bin/bio_suite_supervisor.rs"

[workspace]
members = [".", "seqnet"]

[dependencies]
bio-suite-seqnet = { path = "seqnet", default-features = false }
candle-core = "0.11.1"
candle-nn = "0.11.1"
flate2 = "1.1"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
ureq = { version = "2.10", features = ["json"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = false
