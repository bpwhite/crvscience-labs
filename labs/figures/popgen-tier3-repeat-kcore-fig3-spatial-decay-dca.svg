<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 520" width="100%" height="auto" role="img" aria-label="Graphical Report 3: 5-Window Spatial Flanking Decay Curve, mfDCA Epistasis Falsification, and Bayesian Beaker Calibration">
